<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadeau Maxime">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16205c">
<title>Cadeau Maxime</title>
<style>
@font-face{font-family:'Luckiest Guy';src:url(luckiest-guy.ttf) format('truetype');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:#16205c linear-gradient(#16205c,#3b2f7d) fixed;overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#confetti{z-index:5}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 88px) 20px calc(env(safe-area-inset-bottom) + 28px)}
main.nobar{padding-top:calc(env(safe-area-inset-top) + 24px)}
.card{width:100%;max-width:660px;}
.card>div.stars{width:100%}
.card{text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.title,h1,h2,.btn,.tile,.slot,.keybar b{font-family:'Luckiest Guy',ui-rounded,sans-serif;font-weight:400;letter-spacing:.02em}
h1{font-size:clamp(46px,10vw,84px);margin:.1em 0;color:#ffd23c;text-shadow:0 5px 0 #b5361f,0 12px 22px rgba(0,0,0,.35);line-height:1.05}
h2{font-size:clamp(32px,6.5vw,50px);margin:.15em 0 .25em;color:#ffd23c;text-shadow:0 4px 0 rgba(0,0,0,.28)}
p{font-size:clamp(21px,3.6vw,27px);line-height:1.4;margin:.45em 0;font-weight:700}
p.small{font-size:clamp(17px,2.8vw,21px);opacity:.85}
.gift{width:min(58vw,300px);border-radius:22%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));animation:float 3s ease-in-out infinite}
.btn{display:inline-block;font-size:clamp(28px,5.4vw,38px);color:#4a2500;background:linear-gradient(#ffe066,#ffb020);border:0;border-radius:26px;padding:.55em 1.3em .4em;margin-top:.7em;box-shadow:0 7px 0 #c46d00,0 14px 26px rgba(0,0,0,.3);text-decoration:none;cursor:pointer}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c46d00}
.world{display:inline-flex;align-items:center;gap:.4em;padding:.35em 1em;border-radius:99px;background:rgba(255,255,255,.15);font-size:clamp(18px,3.1vw,23px);font-weight:800}
.emoji{font-size:clamp(76px,15vw,118px);line-height:1.1;margin:.12em 0;animation:float 3s ease-in-out infinite}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:.9em}
.choice{font:inherit;font-size:clamp(22px,4vw,30px);font-weight:800;color:#1d1d4a;background:#fff;border:0;border-radius:22px;padding:.6em .4em;box-shadow:0 6px 0 #b9bde6;cursor:pointer}
.choice .e{display:block;font-size:1.55em;line-height:1.2}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #b9bde6}
.choice.bad{background:#ffd0d6;color:#9a1830;box-shadow:0 6px 0 #e69aa6;animation:shake .4s}
.choice.good{background:#b8f5c4;color:#0e6b2a;box-shadow:0 6px 0 #6fd08a;animation:boing .5s}
.screen{font-family:'Luckiest Guy',sans-serif;font-size:clamp(46px,9vw,64px);min-width:3.2em;display:inline-block;background:#fff;color:#1d1d4a;border-radius:20px;padding:.18em .5em .05em;margin:.4em 0 .2em;min-height:1.35em;box-shadow:inset 0 4px 0 #dfe1f5}
.screen.bad{background:#ffd0d6;animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;margin:.6em auto 0}
.pad button{font-family:'Luckiest Guy',sans-serif;font-size:clamp(30px,6vw,40px);padding:.35em 0 .2em;border:0;border-radius:20px;background:#fff;color:#1d1d4a;box-shadow:0 6px 0 #b9bde6;cursor:pointer}
.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 #b9bde6}
.pad .ok{background:linear-gradient(#7ef29a,#2fc35a);color:#08451d;box-shadow:0 6px 0 #1c8a3d}
.pad .del{background:#ffe1e6;color:#9a1830;box-shadow:0 6px 0 #e69aa6}
.space{position:relative;width:100%;aspect-ratio:16/10;max-height:34vh;margin:.6em auto 0;border-radius:26px;background:radial-gradient(circle at 30% 30%,#2b2a7a,#0b0b2e 75%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.12)}
.space span{position:absolute;transform:translate(-50%,-50%);font-size:clamp(34px,6.5vw,52px);line-height:1;transition:transform .2s,filter .2s}
.space span.counted{transform:translate(-50%,-50%) scale(1.35);filter:drop-shadow(0 0 10px #ffe680)}
.space span i{position:absolute;right:-.5em;top:-.45em;font:16px/1 ui-rounded,system-ui;font-weight:900;font-style:normal;background:#ff4d6d;color:#fff;border-radius:99px;padding:3px 6px}
.msg{min-height:1.5em;font-size:clamp(20px,3.4vw,25px);font-weight:800;margin-top:.6em;color:#ffe680}
.hintbtn{font:inherit;font-size:clamp(19px,3.2vw,23px);font-weight:800;color:#fff;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:.4em 1em;margin-top:.5em;cursor:pointer}
.hint{background:rgba(255,230,128,.16);border:2px dashed rgba(255,230,128,.6);border-radius:18px;padding:.5em .8em;margin-top:.6em;font-size:clamp(19px,3.2vw,23px);font-weight:700}
.tile{display:inline-flex;align-items:center;justify-content:center;width:clamp(54px,11vw,78px);height:clamp(62px,12.5vw,88px);font-size:clamp(36px,7vw,54px);padding-top:.12em;color:#4a2500;background:linear-gradient(#ffe066,#ffb020);border-radius:16px;box-shadow:0 6px 0 #c46d00;border:0;cursor:pointer}
.tile.used{visibility:hidden}
.tile.huge{width:130px;height:146px;font-size:96px;border-radius:26px;box-shadow:0 9px 0 #c46d00,0 0 40px rgba(255,210,60,.6);animation:boing .7s;margin:.2em 0}
.row{display:flex;justify-content:center;gap:clamp(6px,1.6vw,12px);flex-wrap:wrap;margin:.6em 0}
.slot{display:inline-flex;align-items:center;justify-content:center;width:clamp(54px,11vw,78px);height:clamp(62px,12.5vw,88px);font-size:clamp(36px,7vw,54px);padding-top:.12em;border-radius:16px;border:3px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.08);color:#4a2500;cursor:pointer}
.slot.full{border:0;background:linear-gradient(#fff6c9,#ffe066);box-shadow:0 5px 0 #c99a12}
.row.bad .slot{animation:shake .4s;background:#ffd0d6}
.row.good .slot{background:linear-gradient(#b8f5c4,#6fe08f);box-shadow:0 5px 0 #2a9a4b}
.keybar{position:fixed;z-index:3;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);display:flex;justify-content:center;align-items:center;gap:7px}
.keybar .lbl{font-weight:800;font-size:15px;opacity:.85;margin-right:4px}
.keybar b{width:40px;height:46px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;padding-top:4px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.45);border:2px dashed rgba(255,255,255,.35)}
.keybar b.on{background:linear-gradient(#ffe066,#ffb020);color:#4a2500;border:0;box-shadow:0 3px 0 #c46d00}
.gameicon{width:min(44vw,220px);border-radius:22%;box-shadow:0 16px 36px rgba(0,0,0,.45);margin:.3em 0;animation:boing .8s}
.again{display:inline-block;margin-top:1.6em;font-size:16px;color:rgba(255,255,255,.55);text-decoration:underline;background:none;border:0;font-family:inherit;cursor:pointer}
.opening{animation:wobble .5s ease-in-out 3,float 3s ease-in-out infinite 1.5s}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes boing{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
@media (max-height:900px){.emoji{font-size:60px;margin:0}.pad{gap:9px}.pad button{font-size:28px}}
.stars .emoji{display:none}
@media (orientation:landscape) and (min-width:900px){.card:has(.stars){max-width:1040px}.duo{display:flex;gap:28px;align-items:center}.duo .space{flex:1.4;max-height:none;margin:0}.duo>div:last-child{flex:1}.duo .screen{margin-top:0}}

</style>
</head>
<body>
<canvas id="snow" class="fx"></canvas>
<div id="bar" class="keybar" hidden></div>
<main id="main"></main>
<canvas id="confetti" class="fx"></canvas>
<script>
"use strict";
// ───── Les étapes du jeu de piste ─────
const STEPS = [
  { world: "Mont Flocon", icon: "🏔️", big: "❄️", letter: "M", type: "choice",
    text: "Devinette&nbsp;: je tombe du ciel sans faire de bruit, je suis toute froide et je fonds dans ta main. Qui suis-je&nbsp;?",
    choices: [["🌧️", "La pluie"], ["❄️", "La neige"], ["🪶", "Une plume"], ["☁️", "Un nuage"]], answer: 1,
    hint: "Avec moi, on fait des bonshommes et des batailles de boules&nbsp;!",
    bravo: "C'était la neige&nbsp;! Le Mont Flocon en est tout couvert." },
  { world: "Rivière Sauvage", icon: "🌊", big: "🛶", letter: "A", type: "number", answer: 12,
    text: "4 canoës descendent la rivière. Dans chaque canoë, il y a 3 castors 🦫. Combien de castors en tout&nbsp;?",
    hint: "Compte 3 castors, puis encore 3, puis encore 3, puis encore 3&nbsp;: 3 + 3 + 3 + 3.",
    bravo: "12 castors&nbsp;! Quelle équipe de pagayeurs&nbsp;!" },
  { world: "Pause tennis", icon: "🏟️", big: "🎾", letter: "L", type: "choice",
    text: "Au tennis, on compte les points d'une drôle de façon&nbsp;: 0, puis 15, puis 30… et ensuite&nbsp;?",
    choices: [["", "35"], ["", "40"], ["", "45"], ["", "50"]], answer: 1,
    hint: "Ce n'est pas 45&nbsp;! C'est un nombre rond, un peu plus petit.",
    bravo: "15, 30, 40… et jeu&nbsp;! Tu connais tes règles de champion&nbsp;!" },
  { world: "Vallée des Vents", icon: "⛰️", big: "🪁", letter: "I", type: "choice",
    text: "Devinette&nbsp;: je souffle mais je n'ai pas de bouche. Je fais danser les arbres et voler les cerfs-volants. Qui suis-je&nbsp;?",
    choices: [["☀️", "Le soleil"], ["🐦", "Un oiseau"], ["🎈", "Un ballon"], ["🌬️", "Le vent"]], answer: 3,
    hint: "On m'entend faire «&nbsp;whoooosh&nbsp;» quand je passe&nbsp;!",
    bravo: "Le vent, bien sûr&nbsp;! Il souffle très fort dans la Vallée des Vents." },
  { world: "Récif Secret", icon: "🪸", big: "🐠", letter: "N", type: "choice",
    text: "Tout au fond de la mer, un intrus se cache&nbsp;! Lequel de ces animaux ne vit PAS dans la mer&nbsp;?",
    choices: [["🐙", "La pieuvre"], ["🐬", "Le dauphin"], ["🐫", "Le chameau"], ["🦀", "Le crabe"]], answer: 2,
    hint: "Lui, il préfère le sable chaud du désert…",
    bravo: "Un chameau sous l'eau&nbsp;? Ha ha, il était bien mal caché&nbsp;!" },
  { world: "Galaxie Perdue", icon: "🌌", big: "🚀", letter: "A", type: "stars", answer: 9,
    text: "Compte bien&nbsp;: combien d'étoiles ⭐ flottent dans l'espace&nbsp;? Tu peux toucher chaque étoile pour la compter.",
    hint: "Touche les étoiles une par une&nbsp;: un petit numéro apparaît sur chacune. Attention, les planètes ne comptent pas&nbsp;!",
    bravo: "9 étoiles&nbsp;! Tu as des yeux d'astronaute." }
];
const SECRET = "ANIMAL";

// ───── Sauvegarde ─────
const KEY = "cadeau-maxime-v1";
let st = { started: false, step: 0, done: false };
try {
  if (/[?&]reset/.test(location.search)) { localStorage.removeItem(KEY); history.replaceState(null, "", location.pathname); }
  const s = JSON.parse(localStorage.getItem(KEY) || "null");
  if (s && typeof s.step === "number") st = s;
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

// ───── Sons ─────
let ac;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const t0 = ac.currentTime + 0.02;
    const seqs = {
      tap: [[660, 0, 0.08]],
      bad: [[260, 0, 0.18], [200, 0.16, 0.25]],
      ok: [[523, 0, 0.14], [659, 0.1, 0.14], [784, 0.2, 0.14], [1047, 0.3, 0.35]],
      win: [[523, 0, .15], [523, .15, .15], [523, .3, .15], [698, .45, .5], [880, .8, .2], [784, .95, .2], [1047, 1.15, .8]]
    };
    for (const [f, t, d] of seqs[kind]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = kind === "bad" ? "square" : "triangle";
      o.frequency.value = f;
      const v = kind === "bad" ? 0.06 : kind === "tap" ? 0.08 : 0.18;
      g.gain.setValueAtTime(0.0001, t0 + t);
      g.gain.exponentialRampToValueAtTime(v, t0 + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(t0 + t); o.stop(t0 + t + d + 0.05);
    }
  } catch (e) {}
}

// ───── Neige et confettis ─────
const snow = document.getElementById("snow"), sctx = snow.getContext("2d");
const conf = document.getElementById("confetti"), cctx = conf.getContext("2d");
let W, H, flakes = [], bits = [];
function resize() {
  const r = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [snow, conf]) { c.width = W * r; c.height = H * r; c.getContext("2d").setTransform(r, 0, 0, r, 0, 0); }
}
resize(); addEventListener("resize", resize);
for (let i = 0; i < 70; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 3, s: 0.3 + Math.random() * 0.9, w: Math.random() * 6 });
function confetti() {
  const cols = ["#ffd23c", "#ff4d6d", "#4dd8ff", "#7ef29a", "#ffffff", "#b388ff"];
  for (let i = 0; i < 180; i++) bits.push({ x: W / 2, y: H * 0.45, vx: (Math.random() - 0.5) * 16, vy: -6 - Math.random() * 12, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length], s: 6 + Math.random() * 7, life: 0 });
}
function loop() {
  sctx.clearRect(0, 0, W, H); sctx.fillStyle = "rgba(255,255,255,.8)";
  for (const f of flakes) {
    f.y += f.s; f.w += 0.01; f.x += Math.sin(f.w) * 0.4;
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
    sctx.beginPath(); sctx.arc(f.x, f.y, f.r, 0, 7); sctx.fill();
  }
  cctx.clearRect(0, 0, W, H);
  bits = bits.filter(b => b.y < H + 30 && b.life < 400);
  for (const b of bits) {
    b.vy += 0.3; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.r); cctx.fillStyle = b.c;
    cctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cctx.restore();
  }
  requestAnimationFrame(loop);
}
loop();

// ───── Outils d'affichage ─────
const main = document.getElementById("main"), bar = document.getElementById("bar");
const $ = s => main.querySelector(s);
function show(html, withBar) {
  main.innerHTML = '<div class="card">' + html + "</div>";
  main.classList.toggle("nobar", !withBar);
  bar.hidden = !withBar;
  if (withBar) bar.innerHTML = '<span class="lbl">Mot secret</span>' + STEPS.map((s, j) => j < st.step ? '<b class="on">' + s.letter + "</b>" : "<b>?</b>").join("");
  scrollTo(0, 0);
}
const OOPS = ["Presque&nbsp;! Essaie encore 😉", "Pas tout à fait… réfléchis bien 🤔", "Oups&nbsp;! Encore un essai 💪"];
let oopsN = 0;
function oops() { sfx("bad"); return OOPS[oopsN++ % OOPS.length]; }

// ───── Écrans ─────
function render() {
  if (st.done) return gift(false);
  if (!st.started) return intro();
  if (st.step < STEPS.length) return question(st.step);
  return chest();
}

function intro() {
  show('<img class="gift" src="icon-512.png" alt="">' +
    "<h1>Cadeau Maxime</h1>" +
    "<p>Coucou Maxime&nbsp;! 🎄 Un cadeau t'attend… mais il est enfermé dans un coffre magique.</p>" +
    "<p>Pour l'ouvrir, il faut un <b>mot secret</b>. Traverse six mondes et résous leurs énigmes&nbsp;: chacun te donnera une lettre.</p>" +
    '<button class="btn" id="go">C\'est parti&nbsp;!</button>', false);
  $("#go").onclick = () => { sfx("tap"); st.started = true; save(); render(); };
}

function question(i) {
  const s = STEPS[i];
  let zone = "";
  if (s.type === "choice") {
    zone = '<div class="choices">' + s.choices.map(([e, t], k) =>
      '<button class="choice" data-k="' + k + '">' + (e ? '<span class="e">' + e + "</span>" : "") + t + "</button>").join("") + "</div>";
  } else {
    zone = '<div><div class="screen" id="screen">&nbsp;</div><div class="pad" id="pad">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => "<button>" + n + "</button>").join("") +
      '<button class="del" data-a="del">⌫</button><button>0</button><button class="ok" data-a="ok">OK</button></div></div>';
    if (s.type === "stars") zone = '<div class="duo"><div class="space" id="space"></div>' + zone + "</div>";
  }
  show('<div class="' + (s.type === "stars" ? "stars" : "") + '"><div class="world">' + s.icon + " " + s.world + " · " + (i + 1) + "/" + STEPS.length + "</div>" +
    '<div class="emoji">' + s.big + "</div><p>" + s.text + "</p>" + zone +
    '<div class="msg" id="msg"></div><button class="hintbtn" id="hb" hidden>💡 Un indice&nbsp;?</button><div class="hint" id="hint" hidden>' + s.hint + "</div></div>", true);

  const msg = $("#msg"), hb = $("#hb"), hint = $("#hint");
  let locked = false;
  hb.onclick = () => { sfx("tap"); hb.hidden = true; hint.hidden = false; };
  const fail = () => { msg.innerHTML = oops(); if (hint.hidden) hb.hidden = false; };
  const win = () => {
    locked = true; sfx("ok"); msg.innerHTML = "Bravo&nbsp;! 🎉";
    st.step = i + 1; save();
    setTimeout(() => reward(i), 900);
  };

  if (s.type === "choice") {
    main.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      if (locked) return;
      if (+b.dataset.k === s.answer) { b.classList.add("good"); win(); }
      else { b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); fail(); }
    });
  } else {
    const screen = $("#screen"); let val = "";
    const upd = () => screen.innerHTML = val || "&nbsp;";
    $("#pad").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (locked) return;
      const a = b.dataset.a;
      if (a === "del") { val = val.slice(0, -1); sfx("tap"); }
      else if (a === "ok") {
        if (!val) return;
        if (+val === s.answer) { win(); return; }
        screen.classList.remove("bad"); void screen.offsetWidth; screen.classList.add("bad");
        fail(); val = "";
        setTimeout(() => screen.classList.remove("bad"), 450);
      } else if (val.length < 3) { val += b.textContent; sfx("tap"); }
      upd();
    });
    if (s.type === "stars") buildSpace($("#space"), s.answer);
  }
}

// Place les étoiles et les intrus (toujours au même endroit).
function buildSpace(el, nStars) {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cells = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) cells.push([c, r]);
  for (let k = cells.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [cells[k], cells[j]] = [cells[j], cells[k]]; }
  const others = ["🪐", "🌙", "☄️", "🌍", "🛸", "🪐"];
  const items = [...Array(nStars).fill("⭐"), ...others];
  let count = 0;
  items.forEach((it, k) => {
    const [c, r] = cells[k];
    const sp = document.createElement("span");
    sp.textContent = it;
    sp.style.left = (8 + c * 16.8 + (rnd() - 0.5) * 7) + "%";
    sp.style.top = (13 + r * 24.5 + (rnd() - 0.5) * 9) + "%";
    if (it === "⭐") sp.onclick = () => {
      if (sp.classList.contains("counted")) return;
      sp.classList.add("counted"); count++;
      const n = document.createElement("i"); n.textContent = count; sp.appendChild(n);
      sfx("tap");
    };
    el.appendChild(sp);
  });
}

function reward(i) {
  const s = STEPS[i], last = i === STEPS.length - 1;
  show("<h2>Bravo&nbsp;! 🎉</h2><p>" + s.bravo + "</p><p>Tu gagnes une lettre du mot secret&nbsp;:</p>" +
    '<div class="tile huge">' + s.letter + "</div><br>" +
    '<button class="btn" id="next">' + (last ? "Vers le coffre 🔐" : "Monde suivant ➜") + "</button>", true);
  confetti();
  $("#next").onclick = () => { sfx("tap"); render(); };
}

function chest() {
  const letters = STEPS.map(s => s.letter);
  show("<h2>Le coffre magique 🔐</h2>" +
    "<p>Tu as toutes les lettres&nbsp;! Range-les dans le bon ordre pour trouver le mot secret.</p>" +
    '<div class="row" id="slots">' + letters.map(() => '<div class="slot"></div>').join("") + "</div>" +
    '<div class="row" id="tiles">' + letters.map((l, k) => '<button class="tile" data-k="' + k + '">' + l + "</button>").join("") + "</div>" +
    '<p class="small">Touche une lettre pour la poser. Touche-la encore pour l\'enlever.</p>' +
    '<div class="msg" id="msg"></div><button class="hintbtn" id="hb" hidden>💡 Un indice&nbsp;?</button><div class="hint" id="hint" hidden></div>', true);
  const slots = [...main.querySelectorAll(".slot")], tiles = [...main.querySelectorAll(".tile")];
  const row = $("#slots"), msg = $("#msg"), hb = $("#hb"), hint = $("#hint");
  const fill = Array(letters.length).fill(-1);
  let fails = 0, locked = false;
  const hints = ["C'est un mot que tu connais très bien&nbsp;: le chat, le lion et le dauphin en sont tous&nbsp;!",
                 "Il commence par <b>A</b> et finit par <b>L</b>&nbsp;: A _ _ _ _ L"];
  hb.onclick = () => { sfx("tap"); hint.innerHTML = hints[Math.min(fails, hints.length) - 1]; hint.hidden = false; hb.hidden = true; };
  const draw = () => slots.forEach((sl, k) => { sl.textContent = fill[k] < 0 ? "" : letters[fill[k]]; sl.classList.toggle("full", fill[k] >= 0); });
  tiles.forEach(t => t.onclick = () => {
    if (locked) return;
    const k = +t.dataset.k, pos = fill.indexOf(-1);
    if (pos < 0) return;
    fill[pos] = k; t.classList.add("used"); sfx("tap"); draw();
    if (fill.indexOf(-1) < 0) check();
  });
  slots.forEach((sl, p) => sl.onclick = () => {
    if (locked || fill[p] < 0) return;
    tiles[fill[p]].classList.remove("used"); fill[p] = -1; sfx("tap"); draw();
  });
  function check() {
    const word = fill.map(k => letters[k]).join("");
    if (word === SECRET) {
      locked = true; row.classList.add("good"); sfx("ok"); msg.innerHTML = "ANIMAL&nbsp;! Le coffre tremble… 😮";
      st.done = true; save();
      setTimeout(() => gift(true), 1400);
      return;
    }
    locked = true; fails++; row.classList.add("bad"); msg.innerHTML = oops();
    setTimeout(() => {
      row.classList.remove("bad"); fill.fill(-1); tiles.forEach(t => t.classList.remove("used")); draw(); locked = false;
      if (fails <= hints.length) { hb.hidden = false; hint.hidden = true; }
    }, 900);
  }
}

function gift(animate) {
  const final = () => {
    show('<p class="small">Ton cadeau, c\'est…</p><h1>Animal Raid</h1>' +
      '<img class="gameicon" src="../icon-512.png" alt="">' +
      "<p>Un jeu vidéo avec cinq mondes à explorer&nbsp;: le Mont Flocon, la Rivière Sauvage, la Vallée des Vents, le Récif Secret et la Galaxie Perdue&nbsp;!</p>" +
      "<p>Joyeux Noël Maxime&nbsp;! 🎄</p>" +
      '<a class="btn" href="../">Jouer&nbsp;▶</a><br>' +
      '<button class="again" id="again">Refaire le jeu de piste</button>', false);
    $("#again").onclick = () => { st = { started: false, step: 0, done: false }; save(); render(); };
  };
  if (!animate) return final();
  show('<img class="gift opening" src="icon-512.png" alt=""><h2>Le coffre s\'ouvre…</h2>', false);
  setTimeout(() => { sfx("win"); confetti(); setTimeout(confetti, 500); final(); }, 1600);
}

render();
</script>
</body>
</html>
